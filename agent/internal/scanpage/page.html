<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ZhizPrint Scan Station</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
        font-family: -apple-system, "Segoe UI", "PingFang SC", Arial, sans-serif;
        background: #f2f4f7; color: #1f2329; overflow: hidden;
        display: flex; flex-direction: column; touch-action: manipulation;
    }
    header {
        padding: 10px 14px; background: #1f2329; color: #fff;
        font-size: 15px; font-weight: 600; display: flex;
        justify-content: space-between; align-items: center; flex: none;
    }
    header .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; display: inline-block; margin-right: 6px; }
    header .dot.on { background: #22c55e; }
    #focusbar {
        display: none; flex: none; padding: 10px 14px;
        background: #dc2626; color: #fff; font-size: 15px; font-weight: 700;
        text-align: center;
    }
    #banner {
        flex: none; margin: 12px 14px 6px; border-radius: 12px; padding: 14px 16px;
        font-size: 16px; font-weight: 600; line-height: 1.4; min-height: 54px;
        display: flex; align-items: center; transition: background .2s, color .2s;
    }
    #banner.idle { background: #e5e7eb; color: #4b5563; }
    #banner.work { background: #fde68a; color: #78350f; }
    #banner.ok   { background: #bbf7d0; color: #14532d; }
    #banner.fail { background: #fecaca; color: #7f1d1d; }
    #banner.warn { background: #fed7aa; color: #7c2d12; }
    #scanzone { flex: none; padding: 8px 14px 4px; }
    #scan {
        width: 100%; font-size: 22px; padding: 14px 12px; border: 2px solid #cbd5e1;
        border-radius: 12px; background: #fff; outline: none; color: #1f2329;
    }
    #hint { padding: 4px 18px; font-size: 12px; color: #6b7280; flex: none; }
    #history { flex: 1 1 auto; overflow-y: auto; padding: 8px 14px 16px; }
    .row {
        display: flex; justify-content: space-between; align-items: center;
        background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
        font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    .row .code { font-weight: 600; word-break: break-all; margin-right: 8px; }
    .row .msg { color: #6b7280; font-size: 12px; word-break: break-all; text-align: right; }
    .chip { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-left: 8px; }
    .chip.work { background: #f59e0b; } .chip.ok { background: #22c55e; }
    .chip.fail { background: #ef4444; } .chip.warn { background: #f97316; }
    #overlay {
        position: fixed; inset: 0; background: rgba(15, 23, 42, .96); z-index: 50;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #f8fafc; text-align: center; padding: 24px;
    }
    #overlay h1 { font-size: 22px; margin-bottom: 8px; }
    #overlay p { font-size: 14px; color: #cbd5e1; margin-bottom: 28px; }
    #start {
        font-size: 20px; font-weight: 700; color: #0f172a; background: #fbbf24;
        border: none; border-radius: 14px; padding: 16px 44px;
    }
    #start:active { transform: scale(.97); }
</style>
</head>
<body>
<header>
    <span><span class="dot" id="netdot"></span><span id="hdrname">Scan Station</span></span>
    <span id="clock"></span>
</header>
<div id="focusbar">WINDOW LOST FOCUS - scans are paused. Click back into the print window.</div>
<div id="banner" class="idle">Ready</div>
<div id="scanzone">
    <input id="scan" type="text" readonly autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="Scan buffer (scanner writes here)">
</div>
<div id="hint">Scans print automatically. Point the scanner and pull the trigger. Keep this window in front.</div>
<div id="history"></div>
<div id="overlay">
    <h1>Scan Print Workstation</h1>
    <p>Tap to enable sound and start scanning</p>
    <button id="start" type="button">Start Shift</button>
</div>
<script>
(function () {
    "use strict";
    // /s/<token>/... -> API base carries the per-start page token.
    var parts = location.pathname.split("/").filter(function (x) { return x; });
    var TOKEN = (parts.length >= 2 && parts[0] === "s") ? parts[1] : "";
    var BASE = "/s/" + TOKEN;

    var WEDGE = "enter";
    var MSG = {
        ready: "Ready",
        sending: "Sending scan...",
        printing: "Printing...",
        printed: "Sent to printer",
        dup: "Duplicate scan within the window; the earlier job is shown",
        failed: "Print failed",
        unknown: "Result unknown, please check the printer",
        expired: "Job expired",
        net: "Connection lost, retrying...",
        disabled: "Network silent printing is disabled on this site",
        noerp: "Cannot reach the print server - check the network"
    };
    var STATE_CLASS = {
        queued: "work", rendering: "work", ready: "work", sent: "work",
        dispatched: "work", submitted_to_vendor: "work", vendor_confirmed: "work",
        printed_queue_ok: "ok", job_state_final: "ok", printed_vendor_confirmed: "ok",
        failed: "fail", unknown: "warn", expired: "warn"
    };

    var input = document.getElementById("scan");
    var banner = document.getElementById("banner");
    var focusbar = document.getElementById("focusbar");
    var netdot = document.getElementById("netdot");
    var history = document.getElementById("history");
    var overlay = document.getElementById("overlay");
    var clockEl = document.getElementById("clock");
    var hdrname = document.getElementById("hdrname");

    var audioCtx = null;
    var started = false;
    var allowed = true;
    var erpOnline = true;
    var buffer = "";
    var jobs = {};          // job_id -> {status, message, code}
    var order = [];         // job_ids newest last
    var current = null;     // newest job_id
    var pollMs = 3000;
    var pollTimer = null;
    var debounceTimer = null;

    // ---- audio ----
    function beep(freq, dur, delay) {
        if (!audioCtx) { return; }
        var t = audioCtx.currentTime + (delay || 0);
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = "sine";
        gain.gain.value = 0.15;
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + dur);
    }
    function sound(kind) {
        if (kind === "ok") { beep(880, .09, 0); beep(1320, .12, .1); }
        else if (kind === "fail") { beep(220, .35, 0); }
        else if (kind === "warn") { beep(440, .18, 0); }
    }

    // ---- helpers ----
    function uuid4() {
        if (window.crypto && crypto.randomUUID) { return crypto.randomUUID(); }
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
            var r = Math.random() * 16 | 0;
            return (c === "x" ? r : (r & 3 | 8)).toString(16);
        });
    }
    function setBanner(cls, text) {
        banner.className = cls;
        banner.textContent = text;
    }
    function escapeHtml(text) {
        return String(text == null ? "" : text).replace(/[&<>"']/g, function (ch) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
        });
    }
    function api(path, payload) {
        var opts = { method: "GET", headers: {} };
        if (payload) {
            opts.method = "POST";
            opts.headers["Content-Type"] = "application/json";
            opts.body = JSON.stringify(payload);
        }
        return fetch(BASE + path, opts).then(function (resp) {
            netdot.className = "dot on";
            if (!resp.ok) { throw new Error("http " + resp.status); }
            return resp.json();
        }).catch(function () {
            netdot.className = "dot";
            throw new Error("network");
        });
    }

    // ---- history / banner ----
    function statusText(status, message) {
        if (status === "failed") { return message ? MSG.failed + ": " + message : MSG.failed; }
        if (status === "unknown") { return MSG.unknown; }
        if (status === "expired") { return MSG.expired; }
        if (STATE_CLASS[status] === "ok") { return MSG.printed; }
        return MSG.printing;
    }
    function trackJob(id, code) {
        if (!jobs[id]) { order.push(id); jobs[id] = { status: "queued", code: code || "" }; }
        else if (code) { jobs[id].code = code; }
        current = id;
        if (order.length > 10) {
            var old = order.shift();
            delete jobs[old];
            renderHistory();
        }
    }
    function applyView(view) {
        if (!view || !view.job_id) { return; }
        var prev = jobs[view.job_id] || {};
        jobs[view.job_id] = {
            status: view.status,
            message: view.fail_reason || view.message || "",
            code: prev.code || view.code || ""
        };
        if (view.job_id === current) {
            var cls = STATE_CLASS[view.status] || "warn";
            if (prev.status !== view.status) {
                if (cls === "ok") { sound("ok"); }
                else if (cls === "fail") { sound("fail"); }
                else if (cls === "warn" && prev.status) { sound("warn"); }
            }
            setBanner(cls, statusText(view.status, jobs[view.job_id].message));
        }
        renderHistory();
    }
    function renderHistory() {
        var html = "";
        for (var i = order.length - 1; i >= 0; i--) {
            var id = order[i];
            var job = jobs[id] || {};
            var cls = STATE_CLASS[job.status] || "warn";
            html += '<div class="row"><span class="code">' + escapeHtml(job.code || id)
                + '</span><span class="msg">' + escapeHtml(statusText(job.status, job.message))
                + '</span><span class="chip ' + cls + '"></span></div>';
        }
        history.innerHTML = html;
    }

    // ---- submit / poll ----
    function submitCode(code) {
        if (!started) { return; }
        if (!allowed) { sound("warn"); return; }
        if (!erpOnline) { setBanner("warn", MSG.noerp); sound("warn"); return; }
        setBanner("work", MSG.sending);
        trackJob("pending-" + String(Date.now()) + "-" + Math.floor(Math.random() * 1e6), code);
        var pendingId = current;
        api("/submit", { code: code, client_uuid: uuid4() })
            .then(function (resp) {
                order = order.filter(function (x) { return x !== pendingId; });
                delete jobs[pendingId];
                if (resp.error) {
                    current = order.length ? order[order.length - 1] : null;
                    setBanner("fail", resp.error);
                    sound("fail");
                    renderHistory();
                    return;
                }
                trackJob(resp.job_id, code);
                if (resp.dup) {
                    setBanner("work", MSG.dup);
                    sound("warn");
                } else {
                    setBanner("work", MSG.printing);
                }
                renderHistory();
                pollOnce();
            })
            .catch(function () {
                erpOnline = false;
                order = order.filter(function (x) { return x !== pendingId; });
                delete jobs[pendingId];
                current = order.length ? order[order.length - 1] : null;
                setBanner("warn", MSG.noerp);
                sound("warn");
                renderHistory();
            });
    }
    function pollOnce() {
        var ids = order.filter(function (id) { return id.indexOf("pending-") !== 0; });
        if (!ids.length) { return; }
        api("/status", { job_ids: ids })
            .then(function (resp) {
                erpOnline = true;
                (resp.jobs || []).forEach(applyView);
                schedulePoll();
            })
            .catch(function () { schedulePoll(); });
    }
    function schedulePoll() {
        if (pollTimer) { clearTimeout(pollTimer); }
        pollTimer = setTimeout(function () {
            if (started) { pollOnce(); } else { schedulePoll(); }
        }, pollMs);
    }

    // ---- input layer: document keydown (HID gun writes regardless of
    // focus targets; IME composition is discarded; readonly input only
    // shows the buffer). Mirrors the plan 5 PC input contract. ----
    function showBuffer() { input.value = buffer; }
    function appendChar(ch) {
        if (buffer.length < 200) { buffer += ch; showBuffer(); }
        if (WEDGE === "none") {
            if (debounceTimer) { clearTimeout(debounceTimer); }
            debounceTimer = setTimeout(function () {
                var code = buffer;
                buffer = "";
                showBuffer();
                if (code.trim()) { submitCode(code.trim()); }
            }, 300);
        }
    }
    function finishBuffer() {
        if (debounceTimer) { clearTimeout(debounceTimer); }
        var code = buffer;
        buffer = "";
        showBuffer();
        if (code.trim()) { submitCode(code.trim()); }
    }
    document.addEventListener("keydown", function (ev) {
        if (!started) { return; }
        if (ev.isComposing || ev.keyCode === 229) { return; }
        if (ev.key === "Enter") {
            ev.preventDefault();
            finishBuffer();
        } else if (ev.key === "Tab" && WEDGE === "tab") {
            ev.preventDefault();
            finishBuffer();
        } else if (ev.key === "Backspace") {
            ev.preventDefault();
            buffer = buffer.slice(0, -1);
            showBuffer();
        } else if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
            ev.preventDefault();
            appendChar(ev.key);
        }
    });

    // ---- focus watchdog: agent answers with the kiosk focus state ----
    function watchFocus() {
        setInterval(function () {
            fetch(BASE + "/focus").then(function (r) { return r.json(); }).then(function (d) {
                focusbar.style.display = d.focused ? "none" : "block";
            }).catch(function () { /* page dies with the agent anyway */ });
        }, 2000);
    }

    function tickClock() {
        clockEl.textContent = new Date().toTimeString().slice(0, 5);
    }

    // ---- boot ----
    function boot() {
        api("/boot", null).then(function (msg) {
            if (msg.station_name) { hdrname.textContent = msg.station_name; }
            if (msg.wedge_suffix) { WEDGE = msg.wedge_suffix; }
            if (msg.poll_interval_sec && msg.poll_interval_sec >= 2) {
                pollMs = msg.poll_interval_sec * 1000;
            }
            allowed = !!msg.scan_print_enabled;
            erpOnline = !!msg.erp_online;
            if (!msg.scan_print_enabled) {
                setBanner("warn", MSG.disabled);
            } else if (!msg.erp_online) {
                setBanner("warn", MSG.noerp);
            } else {
                setBanner("idle", MSG.ready);
            }
            schedulePoll();
        }).catch(function () {
            setBanner("warn", MSG.net);
            schedulePoll();
        });
    }

    document.getElementById("start").addEventListener("click", function () {
        try {
            var Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) { audioCtx = new Ctx(); if (audioCtx.resume) { audioCtx.resume(); } }
        } catch (err) { audioCtx = null; }
        overlay.style.display = "none";
        started = true;
        beep(660, .08, 0);
        boot();
        watchFocus();
        setInterval(tickClock, 30000);
        tickClock();
    });
})();
</script>
</body>
</html>
